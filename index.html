    /* 10. GEOMETRY DODGE DASH */
    GAME_BUILDERS.dodge = function (mount, opts) {
      var highScore = loadJSON('aze_dodge_best', 0);
      var gameState = 'title';
      var score = 0;
      var elapsed = 0;
      var orbsCollected = 0;
      var rafId = null;
      var lastTime = 0;
      var hitstop = 0;
      var trauma = 0;
      var pointerTarget = null;
      var keys = {};

      mount.innerHTML =
        '<div class="dodge-wrap">' +
          '<canvas class="dodge-canvas" id="dodgeCanvas" data-testid="dodge-canvas"></canvas>' +
          '<div class="dodge-hud">' +
            '<div class="dodge-hud-group">' +
              '<div><div style="font-size:0.7rem;color:#a3a3a3;">SCORE</div><div class="tabular" id="dodgeScore" style="font-size:1.3rem;font-weight:900;">0</div></div>' +
              '<div><div style="font-size:0.7rem;color:#a3a3a3;">BEST</div><div class="tabular" id="dodgeBest" style="font-size:1.3rem;font-weight:900;">' + highScore + '</div></div>' +
            '</div>' +
            '<div class="dodge-hud-group" style="pointer-events:auto;padding:3px;">' +
              '<button type="button" class="btn" id="dodgePauseBtn" style="min-height:32px;padding:4px 10px;font-size:0.8rem;background:#171717;color:#ffffff;border:1.5px solid #ffffff;">Pause [P]</button>' +
            '</div>' +
          '</div>' +
          '<div class="dodge-overlay" id="dodgeOverlay">' +
            '<div class="dodge-modal" id="dodgeModal">' +
              '<h3 style="margin:0;font-size:1.5rem;font-weight:900;">Geometry Dodge Dash</h3>' +
              '<p class="muted-text" style="margin:0;">Move with Arrow keys, WASD, or touch/drag. Dodge white hazards and collect hollow rings.</p>' +
              '<button type="button" class="btn btn-primary" id="dodgeStartBtn" data-start="true">Start Run</button>' +
              '<div class="muted-text" style="font-size:0.8rem;">Space / Enter to Start · P to Pause</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      var canvas = mount.querySelector('#dodgeCanvas');
      var ctx = canvas.getContext('2d');
      var scoreEl = mount.querySelector('#dodgeScore');
      var bestEl = mount.querySelector('#dodgeBest');
      var overlay = mount.querySelector('#dodgeOverlay');
      var modal = mount.querySelector('#dodgeModal');
      var pauseBtn = mount.querySelector('#dodgePauseBtn');

      var player = { x: 320, y: 230, r: 13 };
      var hazards = [];
      var orbs = [];
      var particles = [];
      var spawnTimer = 0;
      var orbTimer = 0;

      function syncBodyState(st) { gameState = st; document.body.dataset.state = st; }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(300, canvas.clientWidth * dpr);
        canvas.height = Math.max(300, canvas.clientHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (gameState === 'title') {
          player.x = canvas.clientWidth / 2;
          player.y = canvas.clientHeight / 2;
        }
      }

      function spawnBurst(x, y, count) {
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var sp = 60 + Math.random() * 210;
          particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.25, maxLife: 0.65 });
        }
      }

      function resetRun() {
        player = { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2, r: 13 };
        hazards = []; orbs = []; particles = [];
        score = 0; elapsed = 0; orbsCollected = 0;
        spawnTimer = 0.6; orbTimer = 1.4; hitstop = 0; trauma = 0; pointerTarget = null;
        scoreEl.textContent = '0';
      }

      function startRun(silent) {
        resetRun();
        syncBodyState('playing');
        overlay.classList.add('hidden');
        if (!silent) SoundFX.pop();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      }

      function showModal(mode) {
        overlay.classList.remove('hidden');
        if (mode === 'paused') {
          modal.innerHTML =
            '<h3 style="margin:0;font-size:1.45rem;font-weight:900;">Paused</h3>' +
            '<div class="tabular muted-text">Score: ' + Math.floor(score) + '</div>' +
            '<button type="button" class="btn btn-primary" id="dodgeResumeBtn">Resume</button>' +
            '<button type="button" class="btn btn-ghost" id="dodgeRestartBtn" data-start="true">Restart Run</button>';
          modal.querySelector('#dodgeResumeBtn').addEventListener('click', function () {
            syncBodyState('playing'); overlay.classList.add('hidden');
          });
          modal.querySelector('#dodgeRestartBtn').addEventListener('click', function () { startRun(false); });
        } else {
          modal.innerHTML =
            '<h3 style="margin:0;font-size:1.5rem;font-weight:900;">Run Ended</h3>' +
            '<div class="tabular" style="font-size:2rem;font-weight:900;">' + Math.floor(score) + ' pts</div>' +
            '<div class="tabular muted-text">Best: ' + highScore + ' · Orbs: ' + orbsCollected + '</div>' +
            '<button type="button" class="btn btn-primary" id="dodgeRetryBtn" data-start="true">Play Again</button>' +
            '<div class="muted-text" style="font-size:0.8rem;">Press Space or Enter to restart</div>';
          modal.querySelector('#dodgeRetryBtn').addEventListener('click', function () { startRun(false); });
        }
      }

      function spawnHazard() {
        var w = canvas.clientWidth; var h = canvas.clientHeight;
        var speedMult = 1 + Math.min(1.8, elapsed * 0.035);
        var roll = Math.random();
        if (roll < 0.42) {
          var fromLeft = Math.random() < 0.5;
          var bw = 64 + Math.random() * 64;
          hazards.push({ type: 'bar', x: fromLeft ? -bw : w + 10, y: 20 + Math.random() * (h - 56), w: bw, h: 16, vx: (fromLeft ? 1 : -1) * (150 + Math.random() * 90) * speedMult, vy: 0 });
        } else if (roll < 0.76) {
          var top = Math.random() < 0.5;
          var sx = 40 + Math.random() * (w - 80);
          var ang = Math.atan2(player.y - (top ? -20 : h + 20), player.x - sx);
          var sp = (195 + Math.random() * 75) * speedMult;
          hazards.push({ type: 'shard', x: sx, y: top ? -20 : h + 20, w: 20, h: 20, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
        } else {
          hazards.push({ type: 'drone', x: Math.random() < 0.5 ? 26 : w - 26, y: 36 + Math.random() * (h - 72), w: 24, h: 24, vx: 0, vy: 0, windup: 0.65 });
        }
      }

      function update(dt) {
        var w = canvas.clientWidth; var h = canvas.clientHeight;
        if (trauma > 0) trauma = Math.max(0, trauma - dt * 2.2);
        if (hitstop > 0) { hitstop -= dt; return; }
        for (var p = particles.length - 1; p >= 0; p--) {
          particles[p].x += particles[p].vx * dt;
          particles[p].y += particles[p].vy * dt;
          particles[p].life -= dt;
          if (particles[p].life <= 0) particles.splice(p, 1);
        }
        if (gameState !== 'playing') return;

        elapsed += dt;
        score += dt * 15;
        scoreEl.textContent = String(Math.floor(score));

        var moveSpeed = 335;
        var ax = 0, ay = 0;
        if (keys.ArrowLeft || keys.KeyA) ax -= 1;
        if (keys.ArrowRight || keys.KeyD) ax += 1;
        if (keys.ArrowUp || keys.KeyW) ay -= 1;
        if (keys.ArrowDown || keys.KeyS) ay += 1;
        if (ax !== 0 || ay !== 0) {
          var mag = Math.hypot(ax, ay);
          player.x += (ax / mag) * moveSpeed * dt;
          player.y += (ay / mag) * moveSpeed * dt;
        } else if (pointerTarget) {
          var dx = pointerTarget.x - player.x;
          var dy = pointerTarget.y - player.y;
          var dist = Math.hypot(dx, dy);
          if (dist > 4) {
            var step = Math.min(dist, moveSpeed * 1.15 * dt);
            player.x += (dx / dist) * step;
            player.y += (dy / dist) * step;
          }
        }
        player.x = Math.max(player.r + 4, Math.min(w - player.r - 4, player.x));
        player.y = Math.max(player.r + 4, Math.min(h - player.r - 4, player.y));

        spawnTimer -= dt;
        if (spawnTimer <= 0) { spawnHazard(); spawnTimer = Math.max(0.28, 0.85 - elapsed * 0.015); }
        orbTimer -= dt;
        if (orbTimer <= 0) { orbs.push({ x: 34 + Math.random() * (w - 68), y: 44 + Math.random() * (h - 88), r: 10 }); orbTimer = 2.6; }

        for (var o = orbs.length - 1; o >= 0; o--) {
          if (Math.hypot(player.x - orbs[o].x, player.y - orbs[o].y) <= player.r + orbs[o].r) {
            score += 25; orbsCollected++;
            spawnBurst(orbs[o].x, orbs[o].y, 12);
            SoundFX.pickup();
            orbs.splice(o, 1);
          }
        }

        for (var i = hazards.length - 1; i >= 0; i--) {
          var hz = hazards[i];
          if (hz.type === 'drone' && hz.windup > 0) {
            hz.windup -= dt;
            if (hz.windup <= 0) {
              var ang = Math.atan2(player.y - hz.y, player.x - hz.x);
              var sp = 320 + Math.min(200, elapsed * 6);
              hz.vx = Math.cos(ang) * sp; hz.vy = Math.sin(ang) * sp;
            }
          } else { hz.x += hz.vx * dt; hz.y += hz.vy * dt; }

          if (hz.x < -160 || hz.x > w + 160 || hz.y < -160 || hz.y > h + 160) { hazards.splice(i, 1); continue; }
          if (Core.circleRectCollides(player.x, player.y, player.r - 2, hz.x, hz.y, hz.w, hz.h)) {
            hitstop = 0.06; trauma = 0.85;
            spawnBurst(player.x, player.y, 26);
            SoundFX.buzz();
            var finalScore = Math.floor(score);
            if (finalScore > highScore) {
              highScore = finalScore;
              saveJSON('aze_dodge_best', highScore);
              bestEl.textContent = String(highScore);
            }
            syncBodyState('gameover');
            showModal('gameover');
            return;
          }
        }
      }

      function render() {
        var w = canvas.clientWidth; var h = canvas.clientHeight;
        ctx.save();
        if (trauma > 0) {
          var shake = trauma * trauma * 10;
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        for (var gx = 0; gx < w; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
        for (var gy = 0; gy < h; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

        orbs.forEach(function (orb) {
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(orb.x, orb.y, 3, 0, Math.PI * 2); ctx.fill();
        });

        hazards.forEach(function (hz) {
          if (hz.type === 'drone' && hz.windup > 0) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(hz.x + hz.w / 2, hz.y + hz.h / 2); ctx.lineTo(player.x, player.y); ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.fillStyle = hz.type === 'bar' ? '#ffffff' : (hz.type === 'drone' ? '#a3a3a3' : '#e5e5e5');
          ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
          ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.5; ctx.strokeRect(hz.x, hz.y, hz.w, hz.h);
        });

        particles.forEach(function (pt) {
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
        });
        ctx.globalAlpha = 1;

        if (gameState !== 'gameover') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(player.x, player.y - player.r);
          ctx.lineTo(player.x + player.r, player.y);
          ctx.lineTo(player.x, player.y + player.r);
          ctx.lineTo(player.x - player.r, player.y);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function loop(now) {
        var rawDt = (now - lastTime) / 1000;
        lastTime = now;
        update(Math.min(0.05, Math.max(0, rawDt)));
        render();
        rafId = requestAnimationFrame(loop);
      }

      function onKeyDown(e) {
        if (activeGameId !== 'dodge') return;
        keys[e.code] = true;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) !== -1) e.preventDefault();
        if ((e.code === 'Space' || e.code === 'Enter') && (gameState === 'title' || gameState === 'gameover')) startRun(false);
        else if ((e.code === 'KeyP' || e.code === 'Escape') && gameState === 'playing') { syncBodyState('paused'); showModal('paused'); }
        else if ((e.code === 'KeyP' || e.code === 'Escape') && gameState === 'paused') { syncBodyState('playing'); overlay.classList.add('hidden'); }
      }
      function onKeyUp(e) { keys[e.code] = false; }
      function onBlur() { keys = {}; pointerTarget = null; }
      function onPointerUp() { pointerTarget = null; }

      canvas.addEventListener('pointerdown', function (e) {
        if (gameState !== 'playing') return;
        var rect = canvas.getBoundingClientRect();
        pointerTarget = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      });
      canvas.addEventListener('pointermove', function (e) {
        if (gameState !== 'playing' || !pointerTarget) return;
        var rect = canvas.getBoundingClientRect();
        pointerTarget = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', onBlur);
      window.addEventListener('resize', resize);

      mount.querySelector('#dodgeStartBtn').addEventListener('click', function () { startRun(false); });
      pauseBtn.addEventListener('click', function () {
        if (gameState === 'playing') { syncBodyState('paused'); showModal('paused'); }
        else if (gameState === 'paused') { syncBodyState('playing'); overlay.classList.add('hidden'); }
      });

      syncBodyState('title');
      resize();
      if (opts && opts.autostart) startRun(true);
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);

      return function cleanup() {
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
        window.removeEventListener('blur', onBlur);
        window.removeEventListener('resize', resize);
      };
    };

    /* 11. GRAVITY SAND & PHYSICS SANDBOX */
    GAME_BUILDERS.sand = function (mount) {
      var GW = 140;
      var GH = 90;
      var grid = new Uint8Array(GW * GH);
      var brush = 1; // 1=Sand, 2=Water, 3=Stone, 4=Fire, 5=Acid, 0=Erase
      var brushRadius = 3;
      var paused = false;
      var drawing = false;
      var pointerPos = null;
      var tick = 0;
      var rafId = null;

      mount.innerHTML =
        '<div class="space-between" style="margin-bottom:12px;">' +
          '<div class="row-wrap" id="sandTools">' +
            '<button type="button" class="btn btn-primary" data-mat="1">Sand</button>' +
            '<button type="button" class="btn btn-ghost" data-mat="2">Water</button>' +
            '<button type="button" class="btn btn-ghost" data-mat="3">Stone</button>' +
            '<button type="button" class="btn btn-ghost" data-mat="4">Fire</button>' +
            '<button type="button" class="btn btn-ghost" data-mat="5">Acid</button>' +
            '<button type="button" class="btn btn-ghost" data-mat="0">Erase</button>' +
          '</div>' +
          '<div class="row-wrap">' +
            '<button type="button" class="btn btn-ghost" id="sandSizeBtn">Brush: M</button>' +
            '<button type="button" class="btn btn-ghost" id="sandPauseBtn">Pause</button>' +
            '<button type="button" class="btn btn-ghost" id="sandDemoBtn">Demo Basin</button>' +
            '<button type="button" class="btn btn-ghost" id="sandClearBtn">Clear</button>' +
          '</div>' +
        '</div>' +
        '<canvas class="sand-canvas" id="sandCanvas" width="' + GW + '" height="' + GH + '" data-testid="sand-canvas"></canvas>' +
        '<div class="muted-text" style="margin-top:8px;">Tip: Stone holds Water &amp; Sand; Fire boils Water; Acid dissolves Stone &amp; Sand.</div>';

      var canvas = mount.querySelector('#sandCanvas');
      var ctx = canvas.getContext('2d');
      var imgData = ctx.createImageData(GW, GH);
      var COLORS = {
        0: [10, 10, 10],
        1: [245, 210, 120],
        2: [96, 175, 255],
        3: [155, 155, 165],
        4: [255, 110, 45],
        5: [110, 245, 95]
      };

      function seedDemo() {
        grid.fill(0);
        // Stone basin
        for (var x = 25; x <= 115; x++) {
          grid[76 * GW + x] = 3;
          grid[77 * GW + x] = 3;
        }
        for (var y = 52; y <= 76; y++) {
          grid[y * GW + 25] = 3;
          grid[y * GW + 115] = 3;
        }
        // Pile of sand & pool of water
        for (var sy = 20; sy < 45; sy++) {
          for (var sx = 45; sx < 65; sx++) grid[sy * GW + sx] = 1;
          for (var wx = 75; wx < 95; wx++) grid[sy * GW + wx] = 2;
        }
      }

      function paint(pos) {
        if (!pos) return;
        for (var dy = -brushRadius; dy <= brushRadius; dy++) {
          for (var dx = -brushRadius; dx <= brushRadius; dx++) {
            if (dx * dx + dy * dy > brushRadius * brushRadius) continue;
            var gx = pos.x + dx;
            var gy = pos.y + dy;
            if (gx >= 0 && gx < GW && gy >= 0 && gy < GH) {
              if (brush === 0 || grid[gy * GW + gx] === 0 || brush === 3) {
                grid[gy * GW + gx] = brush;
              }
            }
          }
        }
      }

      function renderCanvas() {
        var data = imgData.data;
        for (var i = 0; i < grid.length; i++) {
          var c = COLORS[grid[i]] || COLORS[0];
          var p = i * 4;
          data[p] = c[0];
          data[p + 1] = c[1];
          data[p + 2] = c[2];
          data[p + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      function frame() {
        if (drawing && pointerPos) paint(pointerPos);
        if (!paused) {
          tick++;
          Core.stepSandGrid(grid, GW, GH, tick);
        }
        renderCanvas();
        rafId = requestAnimationFrame(frame);
      }

      function getGridPos(e) {
        var rect = canvas.getBoundingClientRect();
        return {
          x: Math.floor(((e.clientX - rect.left) / rect.width) * GW),
          y: Math.floor(((e.clientY - rect.top) / rect.height) * GH)
        };
      }

      canvas.addEventListener('pointerdown', function (e) {
        drawing = true;
        pointerPos = getGridPos(e);
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
        paint(pointerPos);
        SoundFX.click();
      });
      canvas.addEventListener('pointermove', function (e) { if (drawing) pointerPos = getGridPos(e); });
      function onPointerUp() { drawing = false; pointerPos = null; }
      window.addEventListener('pointerup', onPointerUp);

      mount.querySelector('#sandTools').addEventListener('click', function (e) {
        var b = e.target.closest('[data-mat]');
        if (!b) return;
        brush = parseInt(b.dataset.mat, 10);
        mount.querySelectorAll('#sandTools button').forEach(function (btn) {
          btn.className = 'btn ' + (btn === b ? 'btn-primary' : 'btn-ghost');
        });
        SoundFX.click();
      });

      var sizeBtn = mount.querySelector('#sandSizeBtn');
      sizeBtn.addEventListener('click', function () {
        brushRadius = brushRadius === 2 ? 3 : (brushRadius === 3 ? 6 : 2);
        sizeBtn.textContent = 'Brush: ' + (brushRadius === 2 ? 'S' : (brushRadius === 3 ? 'M' : 'L'));
        SoundFX.click();
      });

      var pauseBtn = mount.querySelector('#sandPauseBtn');
      pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        SoundFX.click();
      });

      mount.querySelector('#sandDemoBtn').addEventListener('click', function () {
        seedDemo(); SoundFX.pop();
      });

      mount.querySelector('#sandClearBtn').addEventListener('click', function () {
        grid.fill(0); SoundFX.click();
      });

      seedDemo();
      rafId = requestAnimationFrame(frame);

      return function cleanup() {
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('pointerup', onPointerUp);
      };
    };

    /* 12. MEMORY PATTERN & AIM TRAINER */
    GAME_BUILDERS.memory = function (mount) {
      var mode = 'aim'; // aim | simon
      var aimBest = loadJSON('aze_aim_best', 0);
      var simonBest = loadJSON('aze_simon_best', 0);

      // Aim state
      var aimRunning = false;
      var aimHits = 0;
      var aimMisses = 0;
      var aimEnd = 0;
      var aimRaf = null;
      var aimReactionSum = 0;
      var targetSpawnAt = 0;

      // Simon state
      var simonSeq = [];
      var simonUserIdx = 0;
      var simonLocked = true;
      var simonTimers = [];
      var PADS = [
        { id: 0, label: 'Alpha', freq: 329.63, kind: 'prism' },
        { id: 1, label: 'Beta', freq: 440.0, kind: 'star' },
        { id: 2, label: 'Gamma', freq: 523.25, kind: 'bolt' },
        { id: 3, label: 'Delta', freq: 659.25, kind: 'hole' }
      ];

      mount.innerHTML =
        '<div class="space-between" style="margin-bottom:16px;">' +
          '<div class="segmented" role="group" aria-label="Trainer Mode">' +
            '<button type="button" id="tabAim" aria-pressed="true">Aim Trainer (30s)</button>' +
            '<button type="button" id="tabSimon" aria-pressed="false">Memory Pattern</button>' +
          '</div>' +
          '<div class="tabular muted-text" id="memBestLine">Best Aim: ' + aimBest + ' · Best Pattern: R' + simonBest + '</div>' +
        '</div>' +
        '<div id="memBody"></div>';

      var body = mount.querySelector('#memBody');
      var tabAim = mount.querySelector('#tabAim');
      var tabSimon = mount.querySelector('#tabSimon');
      var bestLine = mount.querySelector('#memBestLine');

      function clearAll() {
        if (aimRaf) { cancelAnimationFrame(aimRaf); aimRaf = null; }
        simonTimers.forEach(function (t) { clearTimeout(t); });
        simonTimers = [];
      }

      function updateBestLine() {
        bestLine.textContent = 'Best Aim: ' + aimBest + ' · Best Pattern: R' + simonBest;
      }

      function renderAim() {
        body.innerHTML =
          '<div class="space-between" style="margin-bottom:10px;">' +
            '<div class="tabular" style="font-weight:800;" id="aimStats">Hits: 0 · Accuracy: 100% · Time: 30.0s</div>' +
            '<button type="button" class="btn btn-primary" id="aimStartBtn">Start 30s Aim Run</button>' +
          '</div>' +
          '<div class="aim-arena" id="aimArena" data-testid="aim-arena">' +
            '<div class="alchemy-board-hint" id="aimPrompt">Press "Start 30s Aim Run" and click targets as fast and accurately as possible.</div>' +
          '</div>';

        var arena = body.querySelector('#aimArena');
        var statsEl = body.querySelector('#aimStats');
        var startBtn = body.querySelector('#aimStartBtn');

        function spawnTarget() {
          arena.innerHTML = '';
          var w = Math.max(120, arena.clientWidth - 70);
          var h = Math.max(120, arena.clientHeight - 70);
          var tx = 35 + Math.random() * w;
          var ty = 35 + Math.random() * h;
          var tBtn = document.createElement('button');
          tBtn.type = 'button';
          tBtn.className = 'aim-target';
          tBtn.style.left = tx + 'px';
          tBtn.style.top = ty + 'px';
          tBtn.setAttribute('aria-label', 'Aim target');
          tBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>';
          targetSpawnAt = performance.now();
          tBtn.addEventListener('pointerdown', function (e) {
            e.stopPropagation();
            if (!aimRunning) return;
            aimHits++;
            aimReactionSum += (performance.now() - targetSpawnAt);
            SoundFX.pickup();
            spawnTarget();
          });
          arena.appendChild(tBtn);
        }

        function tickAim() {
          var rem = Math.max(0, (aimEnd - performance.now()) / 1000);
          var total = aimHits + aimMisses;
          var acc = total > 0 ? Math.round((aimHits / total) * 100) : 100;
          statsEl.textContent = 'Hits: ' + aimHits + ' · Accuracy: ' + acc + '% · Time: ' + rem.toFixed(1) + 's';
          if (rem > 0 && aimRunning) {
            aimRaf = requestAnimationFrame(tickAim);
          } else if (aimRunning) {
            aimRunning = false;
            var avgMs = aimHits > 0 ? Math.round(aimReactionSum / aimHits) : 0;
            if (aimHits > aimBest) {
              aimBest = aimHits;
              saveJSON('aze_aim_best', aimBest);
              updateBestLine();
              SoundFX.chime();
            } else {
              SoundFX.pop();
            }
            arena.innerHTML = '<div class="alchemy-board-hint" style="pointer-events:auto;">Run Complete! ' + aimHits + ' Hits · ' + acc + '% Accuracy · Avg ' + avgMs + ' ms</div>';
            startBtn.textContent = 'Play Again';
          }
        }

        arena.addEventListener('pointerdown', function () {
          if (!aimRunning) return;
          aimMisses++;
          SoundFX.buzz();
        });

        startBtn.addEventListener('click', function () {
          clearAll();
          aimRunning = true;
          aimHits = 0; aimMisses = 0; aimReactionSum = 0;
          aimEnd = performance.now() + 30000;
          startBtn.textContent = 'Restart';
          SoundFX.click();
          spawnTarget();
          aimRaf = requestAnimationFrame(tickAim);
        });
      }

      function renderSimon() {
        body.innerHTML =
          '<div class="space-between">' +
            '<div class="tabular" style="font-weight:800;" id="simRound">Round: 0 · Watch and repeat the sequence</div>' +
            '<button type="button" class="btn btn-primary" id="simStartBtn">Start Sequence</button>' +
          '</div>' +
          '<div class="simon-grid" id="simGrid">' +
            PADS.map(function (p) {
              return '<button type="button" class="simon-pad" data-pad="' + p.id + '">' + getElementSvg(p.kind, 28) + '<span>' + p.label + '</span></button>';
            }).join('') +
          '</div>';

        var roundEl = body.querySelector('#simRound');
        var startBtn = body.querySelector('#simStartBtn');
        var grid = body.querySelector('#simGrid');

        function flashPad(id, dur) {
          var el = grid.querySelector('[data-pad="' + id + '"]');
          if (!el) return;
          el.classList.add('lit');
          SoundFX.tone(PADS[id].freq, (dur || 260) / 1000, 'triangle', 0.09);
          var t = setTimeout(function () { if (el.isConnected) el.classList.remove('lit'); }, dur || 260);
          simonTimers.push(t);
        }

        function playNextRound() {
          simonLocked = true;
          simonUserIdx = 0;
          simonSeq.push(Math.floor(Math.random() * 4));
          roundEl.textContent = 'Round ' + simonSeq.length + ' · Watch carefully...';
          simonSeq.forEach(function (padId, i) {
            var t = setTimeout(function () {
              flashPad(padId, 300);
              if (i === simonSeq.length - 1) {
                var t2 = setTimeout(function () {
                  simonLocked = false;
                  if (roundEl.isConnected) roundEl.textContent = 'Round ' + simonSeq.length + ' · Your turn!';
                }, 380);
                simonTimers.push(t2);
              }
            }, 420 + i * 480);
            simonTimers.push(t);
          });
        }

        grid.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-pad]');
          if (!btn || simonLocked) return;
          var id = parseInt(btn.dataset.pad, 10);
          flashPad(id, 220);
          if (id !== simonSeq[simonUserIdx]) {
            simonLocked = true;
            SoundFX.buzz();
            roundEl.textContent = 'Mistake on Round ' + simonSeq.length + '! Press Start Sequence to retry.';
            return;
          }
          simonUserIdx++;
          if (simonUserIdx >= simonSeq.length) {
            simonLocked = true;
            if (simonSeq.length > simonBest) {
              simonBest = simonSeq.length;
              saveJSON('aze_simon_best', simonBest);
              updateBestLine();
            }
            roundEl.textContent = 'Round ' + simonSeq.length + ' cleared!';
            var t = setTimeout(playNextRound, 650);
            simonTimers.push(t);
          }
        });

        startBtn.addEventListener('click', function () {
          clearAll();
          simonSeq = [];
          SoundFX.click();
          playNextRound();
        });
      }

      tabAim.addEventListener('click', function () {
        clearAll(); aimRunning = false; mode = 'aim';
        tabAim.setAttribute('aria-pressed', 'true');
        tabSimon.setAttribute('aria-pressed', 'false');
        SoundFX.click();
        renderAim();
      });

      tabSimon.addEventListener('click', function () {
        clearAll(); aimRunning = false; mode = 'simon';
        tabAim.setAttribute('aria-pressed', 'false');
        tabSimon.setAttribute('aria-pressed', 'true');
        SoundFX.click();
        renderSimon();
      });

      renderAim();
      return function cleanup() { clearAll(); aimRunning = false; };
    };

    /* ---------------- WIRING HEADER & HUB EVENTS ---------------- */
    document.getElementById('brandHomeBtn').addEventListener('click', function () { SoundFX.click(); showHub(); });
    document.getElementById('backToHubBtn').addEventListener('click', function () { SoundFX.click(); showHub(); });
    document.getElementById('headerRandomBtn').addEventListener('click', openRandomGame);
    document.getElementById('heroRandomBtn').addEventListener('click', openRandomGame);
    document.getElementById('nextRandomBtn').addEventListener('click', openRandomGame);

    document.getElementById('continueLastBtn').addEventListener('click', function () {
      var lastId = loadJSON('aze_last_game', '');
      if (lastId) { SoundFX.click(); openGame(lastId); }
    });

    document.getElementById('themeToggleBtn').addEventListener('click', function () {
      SoundFX.click();
      applyTheme(!inverted);
    });

    document.getElementById('muteToggleBtn').addEventListener('click', function () {
      SoundFX.setMuted(!SoundFX.isMuted());
      syncMuteBtn();
      if (!SoundFX.isMuted()) SoundFX.click();
    });

    document.getElementById('hubFilterBar').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      activeFilter = btn.dataset.cat;
      document.querySelectorAll('#hubFilterBar button').forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      SoundFX.click();
      renderHub();
    });

    document.getElementById('gameGrid').addEventListener('click', function (e) {
      var card = e.target.closest('.game-card[data-game-id]');
      if (!card) return;
      SoundFX.click();
      openGame(card.dataset.gameId);
    });

    /* ---------------- BOOTSTRAP ---------------- */
    applyTheme(inverted);
    syncMuteBtn();
    renderHub();

    var params = new URLSearchParams(window.location.search);
    var directGame = params.get('game');
    if (directGame) {
      openGame(directGame, { autostart: params.get('autostart') === '1' });
    }
  })();
  </script>
</body>
</html>

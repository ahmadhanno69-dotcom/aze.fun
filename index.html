<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZE.fun — Interactive Web Toys, Experiments &amp; Mini-Games</title>
  <meta name="description" content="Minimalist monochrome interactive web toys, experiments, and 12 original mini-games in a single self-contained arcade hub." />
  <meta property="og:title" content="AZE.fun — Interactive Web Toys, Experiments & Mini-Games" />
  <meta property="og:description" content="12 crisp black-and-white interactive toys & mini-games: Element Alchemy, Spend a Trillion, Impossible Password, Perfect Circle, Gravity Sand, Aim & Memory, and more." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-surface: #ffffff;
      --bg-subtle: #f3f3f3;
      --bg-hover: #eaeaea;
      --ink: #0a0a0a;
      --ink-muted: #525252;
      --border: #0a0a0a;
      --border-soft: #d4d4d4;
      --btn-bg: #0a0a0a;
      --btn-ink: #ffffff;
      --shadow-hard: 4px 4px 0px #0a0a0a;
      --shadow-sm: 2px 2px 0px #0a0a0a;
      --pass-bg: #f0fdf4;
      --pass-ink: #0a0a0a;
      --fail-bg: #fef2f2;
      --fail-ink: #0a0a0a;
      --font-display: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }

    html.inverted {
      --bg-canvas: #0a0a0a;
      --bg-surface: #121212;
      --bg-subtle: #1c1c1c;
      --bg-hover: #262626;
      --ink: #ffffff;
      --ink-muted: #a3a3a3;
      --border: #ffffff;
      --border-soft: #333333;
      --btn-bg: #ffffff;
      --btn-ink: #0a0a0a;
      --shadow-hard: 4px 4px 0px #ffffff;
      --shadow-sm: 2px 2px 0px #ffffff;
      --pass-bg: #14261a;
      --pass-ink: #ffffff;
      --fail-bg: #2a1515;
      --fail-ink: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      overflow-x: hidden;
      transition: background-color 160ms ease, color 160ms ease;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    /* Sticky Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      height: 56px;
      background: var(--bg-canvas);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 10px;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.04em;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 40px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--btn-bg);
      color: var(--btn-ink);
      border: 2px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      border: 2px solid var(--border);
      transition: transform 130ms cubic-bezier(0.16, 1, 0.3, 1), background-color 130ms ease, box-shadow 130ms ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    .btn-ghost {
      background: var(--bg-surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .btn-ghost:hover {
      background: var(--bg-subtle);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-ink);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Main Container */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 26px 20px 64px;
    }

    /* Centered Hero Header */
    .hub-hero {
      text-align: center;
      max-width: 680px;
      margin: 8px auto 32px;
      padding: 22px 16px 26px;
      border-bottom: 2px solid var(--border);
    }

    .hub-logo-svg {
      display: block;
      margin: 0 auto 10px;
    }

    .hub-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5.5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .hub-tagline {
      margin: 10px 0 20px;
      font-size: 1.05rem;
      color: var(--ink-muted);
      font-weight: 500;
      text-wrap: balance;
    }

    .hub-cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hub-meta {
      margin-top: 14px;
      font-size: 0.84rem;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Filter Row */
    .hub-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 3px;
      flex-wrap: wrap;
    }

    .segmented button {
      min-height: 34px;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--btn-bg);
      color: var(--btn-ink);
    }

    /* Game Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 960px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
      }
      .topbar {
        padding: 0 10px;
        gap: 6px;
      }
      .brand-btn {
        font-size: 1.05rem;
        gap: 6px;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        font-size: 0.8rem;
      }
      .header-actions {
        gap: 5px;
      }
      .btn-label-hide-sm {
        display: none;
      }
      .topbar .btn {
        padding: 5px 8px;
        font-size: 0.74rem;
        min-height: 34px;
      }
      .container {
        padding: 16px 12px 48px;
      }
      .segmented {
        width: 100%;
        justify-content: center;
      }
      .segmented button {
        padding: 5px 9px;
        font-size: 0.78rem;
      }
    }

    .game-card {
      text-align: left;
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hard);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 160ms ease;
    }

    .game-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0px var(--border);
    }

    .game-card-art {
      height: 136px;
      width: 100%;
      background: var(--bg-subtle);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .game-card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .game-card-kicker {
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .game-card-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.25;
    }

    .game-card-desc {
      margin: 0;
      font-size: 0.88rem;
      color: var(--ink-muted);
      line-height: 1.45;
    }

    .game-card-stat {
      margin-top: auto;
      padding-top: 8px;
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 700;
    }

    /* Active Game Shell & Sticky Back Bar */
    .game-shell {
      display: none;
    }

    .game-shell.active {
      display: block;
    }

    .hub-view.hidden {
      display: none;
    }

    .sticky-back-bar {
      position: sticky;
      top: 56px;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .back-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .game-heading {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .game-subtitle {
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .stage-panel {
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hard);
      padding: 20px;
    }

    .input-field {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-canvas);
      border: 2px solid var(--border);
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 600;
    }

    .input-field:focus {
      outline: none;
      box-shadow: var(--shadow-sm);
    }

    /* Animations */
    @keyframes popBounce {
      0% { transform: scale(0.92); opacity: 0; }
      60% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .pop-in {
      animation: popBounce 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Game 1: Element Alchemy */
    .alchemy-layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .alchemy-layout {
        grid-template-columns: 1fr;
      }
    }

    .alchemy-board {
      position: relative;
      min-height: 440px;
      background: var(--bg-subtle);
      background-image: radial-gradient(var(--border-soft) 1px, transparent 1px);
      background-size: 20px 20px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .alchemy-board-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--ink-muted);
      font-weight: 600;
      font-size: 0.92rem;
      pointer-events: none;
    }

    .alchemy-node {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      min-height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: grab;
      user-select: none;
    }

    .alchemy-node.selected {
      background: var(--btn-bg);
      color: var(--btn-ink);
    }

    .alchemy-sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alchemy-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .element-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      font-size: 0.82rem;
      font-weight: 700;
      transition: transform 120ms ease;
    }

    .element-chip:hover {
      transform: translate(-1px, -1px);
    }

    .discovery-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--btn-bg);
      color: var(--btn-ink);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      font-size: 0.92rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Game 2: Spend Fortune */
    .fortune-header {
      background: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fortune-balance {
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: var(--bg-canvas);
      border: 2px solid var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--btn-bg);
      width: 0%;
      transition: width 180ms ease;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 900px) {
      .shop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .shop-grid { grid-template-columns: 1fr; }
    }

    .shop-card {
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shop-art {
      height: 76px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shop-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      padding-top: 6px;
    }

    .shop-qty {
      min-width: 36px;
      text-align: center;
      font-weight: 800;
    }

    .receipt-box {
      margin-top: 22px;
      border-top: 2px solid var(--border);
      padding-top: 18px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border-soft);
      font-size: 0.9rem;
      gap: 12px;
    }

    /* Game 3: Impossible Password */
    .rule-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .rule-item {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    .rule-item.pass {
      background: var(--pass-bg);
      color: var(--pass-ink);
    }

    .rule-item.fail {
      background: var(--fail-bg);
      color: var(--fail-ink);
      box-shadow: var(--shadow-sm);
    }

    .rule-status {
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Game 4: Perfect Circle */
    .canvas-frame {
      width: 100%;
      background: var(--bg-canvas);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
    }

    .circle-canvas {
      display: block;
      width: 100%;
      height: 420px;
      touch-action: none;
      cursor: crosshair;
    }

    /* Game 5: Reaction & CPS Lab */
    .lab-pad {
      min-height: 280px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-hard);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      gap: 10px;
      user-select: none;
      width: 100%;
      transition: background-color 80ms ease, color 80ms ease;
    }

    .lab-pad.state-wait {
      background: var(--bg-subtle);
    }

    .lab-pad.state-go {
      background: var(--btn-bg);
      color: var(--btn-ink);
    }

    .lab-pad.state-go .muted-text {
      color: var(--btn-ink);
      opacity: 0.85;
    }

    .rank-card {
      margin-top: 14px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Game 6: Deep Sea to Outer Space Explorer */
    .explorer-viewport {
      position: relative;
      height: 540px;
      overflow-y: auto;
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      scroll-behavior: smooth;
    }

    .explorer-hud {
      position: sticky;
      top: 0;
      z-index: 15;
      padding: 12px 16px;
      background: #0a0a0a;
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .explorer-column {
      position: relative;
      width: 100%;
    }

    .explorer-milestone {
      position: absolute;
      left: 16px;
      right: 16px;
      max-width: 580px;
      margin: 0 auto;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: rgba(10, 10, 10, 0.88);
      border: 2px solid #ffffff;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Game 7: Pixel Art Studio */
    .pixel-studio-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 780px) {
      .pixel-studio-grid { grid-template-columns: 1fr; }
    }

    .pixel-canvas {
      display: block;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: #ffffff;
      touch-action: none;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    .swatch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .swatch-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 2px solid var(--border);
    }

    .swatch-btn.active {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    /* Game 8: Life Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    @media (max-width: 780px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    .stat-tile {
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 4px 0;
      word-break: break-word;
    }

      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;

      width: 100%;
      accent-color: var(--ink);
      height: 24px;
      cursor: pointer;

      position: relative;
      width: 100%;
      height: 460px;
      background: #0a0a0a;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;

      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .dodge-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: #ffffff;
    }

    .dodge-hud-group {
      display: flex;
      gap: 16px;
      background: rgba(10, 10, 10, 0.9);
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .dodge-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(10, 10, 10, 0.82);

    }

      color: var(--ink);
      border: 2px solid var(--border);

      max-width: 390px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;

      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      touch-action: none;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    .aim-arena {
      position: relative;
      height: 400px;
      background: var(--bg-subtle);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      user-select: none;
    }

    .aim-target {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--btn-ink);
      border: 3px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
    }

    .simon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 420px;
      margin: 18px auto 0;

      height: 130px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-hard);
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      transition: transform 90ms ease, background-color 90ms ease, color 90ms ease;
    }

    .simon-pad.lit {
      background: var(--btn-bg);
      color: var(--btn-ink);
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .muted-text {
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .row-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .space-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }

    /* ---------------- GAME MANAGER & LIFECYCLE ---------------- */
    var activeGameId = null;
    var activeCleanup = null;
    var activeFilter = 'all';

    function runCleanup() {
      if (typeof activeCleanup === 'function') {
        try { activeCleanup(); } catch (e) {}
        activeCleanup = null;
      }
      document.body.dataset.state = 'hub';
    }

    function renderHub() {
      var grid = document.getElementById('gameGrid');
      var filtered = GAMES.filter(function (g) {
        return activeFilter === 'all' || g.category === activeFilter;
      });
      grid.innerHTML = filtered.map(function (g, idx) {
        return (
          '<button type="button" class="game-card" data-game-id="' + g.id + '">' +
            '<div class="game-card-art">' + g.svg + '</div>' +
            '<div class="game-card-body">' +
              '<div class="game-card-kicker"><span>' + String(idx + 1).padStart(2, '0') + '</span><span aria-hidden="true">·</span><span>' + g.tag + '</span></div>' +
              '<h2 class="game-card-title">' + g.title + '</h2>' +
              '<p class="game-card-desc">' + g.desc + '</p>' +
              '<div class="game-card-stat tabular">' + g.statFn() + '</div>' +
            '</div>' +
          '</button>'
        );
      }).join('');

      var played = loadJSON('aze_played_ids', []);
      document.getElementById('hubProgressText').textContent = played.length + ' / ' + GAMES.length + ' Played · Saved Locally';

      var lastId = loadJSON('aze_last_game', '');
      var contBtn = document.getElementById('continueLastBtn');
      if (lastId) {
        var found = GAMES.find(function (g) { return g.id === lastId; });
        if (found) {
          contBtn.style.display = 'inline-flex';
          contBtn.textContent = 'Resume: ' + found.title;
        }
      }
    }

    function showHub() {
      runCleanup();
      activeGameId = null;
      document.getElementById('gameShell').classList.remove('active');
      document.getElementById('hubView').classList.remove('hidden');
      document.getElementById('gameMount').innerHTML = '';
      renderHub();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function openGame(gameId, opts) {
      var game = GAMES.find(function (g) { return g.id === gameId; });
      if (!game) return;
      runCleanup();
      activeGameId = game.id;
      saveJSON('aze_last_game', game.id);
      var played = loadJSON('aze_played_ids', []);
      if (played.indexOf(game.id) === -1) {
        played.push(game.id);
        saveJSON('aze_played_ids', played);
      }

      document.getElementById('hubView').classList.add('hidden');
      document.getElementById('gameShell').classList.add('active');
      document.getElementById('activeGameTitle').textContent = game.title;
      document.getElementById('activeGameSubtitle').textContent = game.desc;

      var mount = document.getElementById('gameMount');
      mount.innerHTML = '';
      var builder = GAME_BUILDERS[game.id];
      if (builder) {
        activeCleanup = builder(mount, opts || {}) || null;
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function openRandomGame() {
      SoundFX.click();
      var pool = GAMES.filter(function (g) { return g.id !== activeGameId; });
      var pick = pool[Math.floor(Math.random() * pool.length)];
      openGame(pick.id);
    }

    /* ---------------- 12 MINI-GAME BUILDERS ---------------- */
    var GAME_BUILDERS = {};

    /* 1. ELEMENT ALCHEMY */
    GAME_BUILDERS.alchemy = function (mount) {
      var discovered = loadJSON('aze_alchemy_discovered', ['fire', 'water', 'earth', 'air']);
      var totalCount = Object.keys(Core.ELEMENTS).length;
      var nodes = [];
      var nextUid = 1;
      var selectedUid = null;
      var dragging = null;
      var searchQ = '';
      var confirmReset = false;

      mount.innerHTML =
        '<div class="space-between" style="margin-bottom:12px;">' +
          '<div class="tabular" style="font-weight:800;">Discovered: <span id="alcCount"></span> / ' + totalCount + '</div>' +
          '<div class="row-wrap">' +
            '<button type="button" class="btn btn-ghost" id="alcClearBoard">Clear Workspace</button>' +
            '<button type="button" class="btn btn-ghost" id="alcResetAll">Reset Progress</button>' +
          '</div>' +
        '</div>' +
        '<div id="alcDiscoveryBanner" class="discovery-banner" style="display:none;margin-bottom:12px;"></div>' +
        '<div class="alchemy-layout">' +
          '<div class="alchemy-board" id="alcBoard" data-testid="alchemy-board">' +
            '<div class="alchemy-board-hint" id="alcHint">Click elements on the right to spawn them here, then drag or click two elements together to combine!</div>' +
          '</div>' +
          '<div class="alchemy-sidebar">' +
            '<label for="alcSearch" style="font-size:0.85rem;font-weight:700;">Discovered Elements</label>' +
            '<input id="alcSearch" type="search" class="input-field" placeholder="Filter elements..." />' +
            '<div class="alchemy-palette" id="alcPalette"></div>' +
          '</div>' +
        '</div>';

      var board = mount.querySelector('#alcBoard');
      var hint = mount.querySelector('#alcHint');
      var palette = mount.querySelector('#alcPalette');
      var countEl = mount.querySelector('#alcCount');
      var banner = mount.querySelector('#alcDiscoveryBanner');
      var resetBtn = mount.querySelector('#alcResetAll');

      function updateHeader() {
        countEl.textContent = String(discovered.length);
        hint.style.display = nodes.length === 0 ? 'flex' : 'none';
      }

      function showBanner(el, isNew) {
        banner.style.display = 'flex';
        banner.classList.remove('pop-in');
        void banner.offsetWidth;
        banner.classList.add('pop-in');
        banner.innerHTML =
          '<span class="row-wrap">' + getElementSvg(el.kind, 20) + '<span>' + (isNew ? 'NEW DISCOVERY! ' : 'Combined: ') + el.name + '</span></span>' +
          '<span class="tabular">' + discovered.length + '/' + totalCount + '</span>';
      }

      function renderPalette() {
        var q = searchQ.trim().toLowerCase();
        var html = discovered.filter(function (id) {
          var el = Core.ELEMENTS[id];
          return el && (!q || el.name.toLowerCase().indexOf(q) !== -1);
        }).map(function (id) {
          var el = Core.ELEMENTS[id];
          return '<button type="button" class="element-chip" data-el-id="' + el.id + '" aria-label="Spawn ' + el.name + '">' + getElementSvg(el.kind, 16) + '<span>' + el.name + '</span></button>';
        }).join('');
        palette.innerHTML = html || '<div class="muted-text">No matching elements.</div>';
      }

      function renderNodes() {
        var existing = board.querySelectorAll('.alchemy-node');
        for (var i = 0; i < existing.length; i++) existing[i].remove();

        nodes.forEach(function (n) {
          var el = Core.ELEMENTS[n.id];
          if (!el) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'alchemy-node' + (selectedUid === n.uid ? ' selected' : '');
          btn.style.left = n.x + 'px';
          btn.style.top = n.y + 'px';
          btn.dataset.uid = String(n.uid);
          btn.setAttribute('aria-label', el.name + ' on workspace');
          btn.innerHTML = getElementSvg(el.kind, 18) + '<span>' + el.name + '</span>';
          board.appendChild(btn);
        });
        updateHeader();
      }

      function spawnNode(id, x, y) {
        var bw = Math.max(200, board.clientWidth - 130);
        var bh = Math.max(180, board.clientHeight - 54);
        var nx = typeof x === 'number' ? Math.max(8, Math.min(bw, x)) : 24 + ((nodes.length * 41) % Math.max(60, bw - 30));
        var ny = typeof y === 'number' ? Math.max(8, Math.min(bh, y)) : 24 + ((nodes.length * 31) % Math.max(60, bh - 30));
        nodes.push({ uid: nextUid++, id: id, x: nx, y: ny });
        renderNodes();
      }

      function tryCombineNodes(nodeA, nodeB) {
        var result = Core.combineElements(nodeA.id, nodeB.id);
        if (!result) {
          SoundFX.buzz();
          return false;
        }
        var midX = (nodeA.x + nodeB.x) / 2;
        var midY = (nodeA.y + nodeB.y) / 2;
        nodes = nodes.filter(function (n) { return n.uid !== nodeA.uid && n.uid !== nodeB.uid; });
        nodes.push({ uid: nextUid++, id: result.id, x: midX, y: midY });
        selectedUid = null;

        var isNew = discovered.indexOf(result.id) === -1;
        if (isNew) {
          discovered.push(result.id);
          saveJSON('aze_alchemy_discovered', discovered);
          SoundFX.chime();
          renderPalette();
        } else {
          SoundFX.pop();
        }
        showBanner(result, isNew);
        renderNodes();
        return true;
      }

      palette.addEventListener('click', function (e) {
        var chip = e.target.closest('[data-el-id]');
        if (!chip) return;
        SoundFX.click();
        spawnNode(chip.dataset.elId);
      });

      board.addEventListener('pointerdown', function (e) {
        var nodeBtn = e.target.closest('.alchemy-node');
        if (!nodeBtn) {
          selectedUid = null;
          renderNodes();
          return;
        }
        var uid = parseInt(nodeBtn.dataset.uid, 10);
        var node = nodes.find(function (n) { return n.uid === uid; });
        if (!node) return;
        var rect = board.getBoundingClientRect();
        dragging = {
          uid: uid,
          startX: e.clientX,
          startY: e.clientY,
          offsetX: e.clientX - rect.left - node.x,
          offsetY: e.clientY - rect.top - node.y,
          moved: false
        };
        if (nodeBtn.setPointerCapture) {
          try { nodeBtn.setPointerCapture(e.pointerId); } catch (err) {}
        }
      });

      function onPointerMove(e) {
        if (!dragging) return;
        if (Math.hypot(e.clientX - dragging.startX, e.clientY - dragging.startY) > 4) dragging.moved = true;
        var node = nodes.find(function (n) { return n.uid === dragging.uid; });
        if (!node) return;
        var rect = board.getBoundingClientRect();
        node.x = Math.max(4, Math.min(rect.width - 115, e.clientX - rect.left - dragging.offsetX));
        node.y = Math.max(4, Math.min(rect.height - 46, e.clientY - rect.top - dragging.offsetY));
        var dom = board.querySelector('[data-uid="' + node.uid + '"]');
        if (dom) {
          dom.style.left = node.x + 'px';
          dom.style.top = node.y + 'px';
        }
      }

      function onPointerUp() {
        if (!dragging) return;
        var dragged = nodes.find(function (n) { return n.uid === dragging.uid; });
        var wasMoved = dragging.moved;
        dragging = null;
        if (!dragged) return;
        if (wasMoved) {
          var hit = nodes.find(function (other) {
            return other.uid !== dragged.uid && Math.abs(other.x - dragged.x) < 78 && Math.abs(other.y - dragged.y) < 38;
          });
          if (hit) { tryCombineNodes(dragged, hit); return; }
        } else {
          if (selectedUid !== null && selectedUid !== dragged.uid) {
            var prev = nodes.find(function (n) { return n.uid === selectedUid; });
            if (prev) { tryCombineNodes(prev, dragged); return; }
          }
          selectedUid = selectedUid === dragged.uid ? null : dragged.uid;
          SoundFX.click();
          renderNodes();
        }
      }

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);

      mount.querySelector('#alcSearch').addEventListener('input', function (e) {
        searchQ = e.target.value;
        renderPalette();
      });
      mount.querySelector('#alcClearBoard').addEventListener('click', function () {
        SoundFX.click();
        nodes = [];
        selectedUid = null;
        renderNodes();
      });
      resetBtn.addEventListener('click', function () {
        if (!confirmReset) {
          confirmReset = true;
          resetBtn.textContent = 'Confirm Reset?';
          setTimeout(function () {
            confirmReset = false;
            if (resetBtn.isConnected) resetBtn.textContent = 'Reset Progress';
          }, 3000);
          return;
        }
        confirmReset = false;
        resetBtn.textContent = 'Reset Progress';
        discovered = ['fire', 'water', 'earth', 'air'];
        saveJSON('aze_alchemy_discovered', discovered);
        nodes = [];
        selectedUid = null;
        banner.style.display = 'none';
        SoundFX.click();
        renderPalette();
        renderNodes();
      });

      renderPalette();
      renderNodes();
      return function cleanup() {
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
      };
    };

      var winEl = mount.querySelector('#pwVictory');
      var prevPassIds = {};

      function update() {
        var val = inputEl.value;
        var evalRes = Core.evaluatePasswordRules(val, new Date());

        while (unlockedCount < evalRes.rules.length) {
          var allVisiblePass = true;
          for (var i = 0; i < unlockedCount; i++) {
            if (!evalRes.rules[i].pass) { allVisiblePass = false; break; }
          }
          if (allVisiblePass) unlockedCount++;
          else break;
        }

        if (evalRes.passedCount > best) {
          best = evalRes.passedCount;
          saveJSON('aze_password_best', best);
        }

        scoreEl.textContent = 'Passed: ' + evalRes.passedCount + ' / 12';
        metaEl.textContent = 'Length: ' + val.length + ' · Digit Sum: ' + evalRes.digitSum + ' / 25';
        if (evalRes.allPassed) {
          if (winEl.style.display === 'none') SoundFX.chime();
          winEl.style.display = 'flex';
        } else {
          winEl.style.display = 'none';
        }

        var visible = evalRes.rules.slice(0, unlockedCount);
        visible.sort(function (a, b) {
          if (a.pass === b.pass) return b.id - a.id;
          return a.pass ? 1 : -1;
        });

        rulesEl.innerHTML = visible.map(function (r) {
          var newlyPassed = r.pass && !prevPassIds[r.id];
          prevPassIds[r.id] = r.pass;
          return (
            '<div class="rule-item ' + (r.pass ? 'pass' : 'fail') + (newlyPassed ? ' pop-in' : '') + '">' +
              '<div><strong>Rule ' + r.id + ':</strong> ' + r.text + '</div>' +
              '<span class="rule-status">' + (r.pass ? '✓ PASS' : '✕ NEEDED') + '</span>' +
            '</div>'
          );
        }).join('');
      }

      inputEl.addEventListener('input', update);
      update();
      return null;
    };

    /* 4. DRAW A PERFECT CIRCLE (with 95%+ confetti burst!) */
    GAME_BUILDERS.circle = function (mount) {
      var best = loadJSON('aze_circle_best', 0);
      var drawing = false;
      var points = [];
      var confetti = [];
      var confettiRaf = null;

      mount.innerHTML =
        '<div class="space-between" style="margin-bottom:12px;">' +
          '<div>' +
            '<div class="muted-text">Draw a continuous circle around the center dot.</div>' +
            '<div id="circFeedback" style="font-weight:800;margin-top:2px;">Click and drag to draw</div>' +
          '</div>' +
          '<div class="row-wrap">' +
            '<div class="tabular" style="font-size:1.6rem;font-weight:900;" id="circScore">0.0%</div>' +
            '<div class="tabular muted-text" id="circBest">Best: ' + best.toFixed(1) + '%</div>' +
          '</div>' +
        '</div>' +
        '<div class="canvas-frame"><canvas class="circle-canvas" id="circCanvas" data-testid="circle-canvas"></canvas></div>';

      var canvas = mount.querySelector('#circCanvas');
      var ctx = canvas.getContext('2d');
      var scoreEl = mount.querySelector('#circScore');
      var bestEl = mount.querySelector('#circBest');
      var fbEl = mount.querySelector('#circFeedback');

      function getColors() {
        var cs = getComputedStyle(document.documentElement);
        return {
          ink: cs.getPropertyValue('--ink').trim() || '#0a0a0a',
          muted: cs.getPropertyValue('--ink-muted').trim() || '#666666'
        };
      }

      function getCenter() {
        return { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 };
      }

      function resizeCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(300, canvas.clientWidth * dpr);
        canvas.height = Math.max(300, canvas.clientHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function redraw() {
        var w = canvas.clientWidth;
        var h = canvas.clientHeight;
        var col = getColors();
        ctx.clearRect(0, 0, w, h);
        var c = getCenter();

        // Precision visual crosshair & concentric guide rings
        ctx.strokeStyle = col.muted;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 1;
        [75, 135].forEach(function (rad) {
          ctx.beginPath();
          ctx.setLineDash([4, 6]);
          ctx.arc(c.x, c.y, rad, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(c.x - 18, c.y); ctx.lineTo(c.x + 18, c.y);
        ctx.moveTo(c.x, c.y - 18); ctx.lineTo(c.x, c.y + 18);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.fillStyle = col.ink;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
        ctx.fill();

        if (points.length >= 2) {
          var res = Core.scorePerfectCircle(points, c);
          var meanR = res.meanR || Math.hypot(points[0].x - c.x, points[0].y - c.y);

          if (!drawing && res.valid && res.meanR) {
            ctx.strokeStyle = col.muted;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(c.x, c.y, res.meanR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
          }

          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (var i = 1; i < points.length; i++) {
            var p0 = points[i - 1];
            var p1 = points[i];
            var r = Math.hypot(p1.x - c.x, p1.y - c.y);
            var err = meanR ? Math.abs(r - meanR) / meanR : 0;
            ctx.strokeStyle = err < 0.06 ? '#16a34a' : (err < 0.14 ? '#d97706' : '#dc2626');
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }
        }

        // Confetti overlay
        for (var k = 0; k < confetti.length; k++) {
          var cf = confetti[k];
          ctx.fillStyle = cf.color;
          ctx.fillRect(cf.x, cf.y, cf.size, cf.size);
        }
      }

      function launchConfetti() {
        var c = getCenter();
        var col = getColors();
        confetti = [];
        for (var i = 0; i < 65; i++) {
          var a = Math.random() * Math.PI * 2;
          var sp = 80 + Math.random() * 260;
          confetti.push({
            x: c.x, y: c.y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 90,
            size: 4 + Math.random() * 4,
            color: i % 2 === 0 ? col.ink : '#16a34a',
            life: 1.4
          });
        }
        var last = performance.now();
        function step(now) {
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          for (var i = confetti.length - 1; i >= 0; i--) {
            confetti[i].x += confetti[i].vx * dt;
            confetti[i].y += confetti[i].vy * dt;
            confetti[i].vy += 320 * dt;
            confetti[i].life -= dt;
            if (confetti[i].life <= 0) confetti.splice(i, 1);
          }
          redraw();
          if (confetti.length > 0) confettiRaf = requestAnimationFrame(step);
          else confettiRaf = null;
        }
        if (confettiRaf) cancelAnimationFrame(confettiRaf);
        confettiRaf = requestAnimationFrame(step);
      }

      function getPos(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', function (e) {
        drawing = true;
        confetti = [];
        points = [getPos(e)];
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        }
        fbEl.textContent = 'Keep going...';
        scoreEl.textContent = '0.0%';
        redraw();
      });

      canvas.addEventListener('pointermove', function (e) {
        if (!drawing) return;
        var pt = getPos(e);
        var last = points[points.length - 1];
        if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= 3) {
          points.push(pt);
          var res = Core.scorePerfectCircle(points, getCenter());
          if (res.valid) scoreEl.textContent = res.score.toFixed(1) + '%';
          redraw();
        }
      });

      function finishStroke() {
        if (!drawing) return;
        drawing = false;
        var res = Core.scorePerfectCircle(points, getCenter());
        scoreEl.textContent = res.score.toFixed(1) + '%';
        fbEl.textContent = res.feedback;
        if (res.valid) {
          if (res.score >= 95) {
            SoundFX.chime();
            launchConfetti();
          } else if (res.score > best) {
            SoundFX.chime();
          } else {
            SoundFX.pop();
          }
          if (res.score > best) {
            best = res.score;
            saveJSON('aze_circle_best', best);
            bestEl.textContent = 'Best: ' + best.toFixed(1) + '%';
          }
        } else {
          SoundFX.buzz();
        }
        redraw();
      }

      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointercancel', finishStroke);
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      return function cleanup() {
        if (confettiRaf) cancelAnimationFrame(confettiRaf);
        window.removeEventListener('resize', resizeCanvas);
      };
    };

    GAME_BUILDERS.reaction = function (mount) {

      function clearTimers() {
        if (reflexTimer) { clearTimeout(reflexTimer); reflexTimer = null; }

      }

      function renderReflex() {
        var avg = reflexHistory.length ? Math.round(reflexHistory.reduce(function (a, b) { return a + b; }, 0) / reflexHistory.length) : 0;
        var stateClass = reflexState === 'waiting' ? 'state-wait' : (reflexState === 'go' ? 'state-go' : '');
        var title = 'Click to Start Reflex Test';
        var sub = 'Wait for the pad to invert solid, then click immediately.';
        if (reflexState === 'waiting') { title = 'Wait for Flash...'; sub = 'Steady — do not click early!'; }
        else if (reflexState === 'go') { title = 'CLICK NOW!'; sub = 'React!'; }
        else if (reflexState === 'tooSoon') { title = 'Too Soon!'; sub = 'Click to restart attempt.'; }
        else if (reflexState === 'done') {
          title = reflexHistory[reflexHistory.length - 1] + ' ms';
          sub = 'Click to test again · 5-round Avg: ' + avg + ' ms';
        }

        body.innerHTML =
          '<button type="button" class="lab-pad ' + stateClass + '" id="reflexPad">' +
            '<span class="tabular" style="font-size:2.4rem;font-weight:900;">' + title + '</span>' +
            '<span class="muted-text">' + sub + '</span>' +
          '</button>' +
          (reflexHistory.length ? '<div class="muted-text tabular" style="margin-top:12px;">Recent: ' + reflexHistory.join(' ms, ') + ' ms</div>' : '');

        body.querySelector('#reflexPad').addEventListener('pointerdown', function () {
          if (reflexState === 'idle' || reflexState === 'done' || reflexState === 'tooSoon') {
            SoundFX.click();
            reflexState = 'waiting';
            renderReflex();
            reflexTimer = setTimeout(function () {
              reflexState = 'go';
              goTimestamp = performance.now();
              SoundFX.pop();
              renderReflex();
            }, 1300 + Math.random() * 2400);
          } else if (reflexState === 'waiting') {
            clearTimeout(reflexTimer);
            reflexTimer = null;
            reflexState = 'tooSoon';
            SoundFX.buzz();
            renderReflex();
          } else if (reflexState === 'go') {
            var ms = Math.max(1, Math.round(performance.now() - goTimestamp));
            reflexHistory.push(ms);
            if (reflexHistory.length > 5) reflexHistory.shift();
            if (!bestMs || ms < bestMs) {
              bestMs = ms;
              saveJSON('aze_reflex_best', bestMs);
              SoundFX.chime();
            } else {
              SoundFX.pickup();
            }
            reflexState = 'done';
            updateBestText();
            renderReflex();
          }
        });
      }

      function renderCps() {

        var rank = Core.getCpsRank(finalCps);
        body.innerHTML =
          '<button type="button" class="lab-pad ' + (cpsState === 'running' ? 'state-go' : '') + '" id="cpsPad">' +
            '<span class="tabular" style="font-size:2.4rem;font-weight:900;" id="cpsMain">' +
              (cpsState === 'idle' ? 'Start 10s Click Test' : (cpsState === 'running' ? cpsClicks + ' Clicks' : finalCps.toFixed(1) + ' CPS')) +
            '</span>' +
            '<span class="tabular muted-text" id="cpsSub">' +
              (cpsState === 'idle' ? 'Click rapidly for 10 seconds to unlock your rank badge.' :
                (cpsState === 'running' ? '10.0s remaining' : 'Click pad to try again')) +

          '</button>' +
          (cpsState === 'done'

            : '');

        var pad = body.querySelector('#cpsPad');
        var mainEl = body.querySelector('#cpsMain');
        var subEl = body.querySelector('#cpsSub');

        function tick() {
          var rem = Math.max(0, (cpsEndTime - performance.now()) / 1000);
          var curCps = cpsClicks / Math.max(0.1, 10 - rem);
          if (rem > 0) {
            subEl.textContent = rem.toFixed(1) + 's left · Live: ' + curCps.toFixed(1) + ' CPS';
            cpsRaf = requestAnimationFrame(tick);
          } else {
            cpsState = 'done';
            var scoreCps = Math.round((cpsClicks / 10) * 10) / 10;

              bestCps = scoreCps;

              SoundFX.chime();

              SoundFX.pop();
            }
            updateBestText();
            renderCps();

      var canvas = mount.querySelector('#pxCanvas');
      var ctx = canvas.getContext('2d');
      var swatches = mount.querySelector('#pxSwatches');

      function drawGrid() {
        var cell = canvas.width / SIZE;
        for (var y = 0; y < SIZE; y++) {
          for (var x = 0; x < SIZE; x++) {
            ctx.fillStyle = grid[y * SIZE + x];
            ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
        ctx.strokeStyle = 'rgba(10, 10, 10, 0.14)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= SIZE; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
        }
      }

      function renderSwatches() {
        swatches.innerHTML = PALETTE.map(function (c) {

        var rect = canvas.getBoundingClientRect();
        var x = Math.floor(((e.clientX - rect.left) / rect.width) * SIZE);
        var y = Math.floor(((e.clientY - rect.top) / rect.height) * SIZE);

          if (mirror) grid[y * SIZE + (SIZE - 1 - x)] = col;
        }
        drawGrid();
      }

      canvas.addEventListener('pointerdown', function (e) {

        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }

        if (tool !== 'fill') SoundFX.click();

      canvas.addEventListener('pointermove', function (e) { if (painting && tool !== 'fill') paintAt(e); });
      function onPointerUp() { painting = false; }

      function syncToolBtns() {

      mount.querySelectorAll('[data-px-tool]').forEach(function (b) {

      });

        SoundFX.click();
      });

      mount.querySelector('#pxPresetSkull').addEventListener('click', function () {
        var art = [
          '................',
          '....XXXXXXXX....',
          '...XXXXXXXXXX...',
          '..XXXXXXXXXXXX..',
          '..XXXXXXXXXXXX..',
          '..XX...XX...XX..',
          '..XX...XX...XX..',
          '..XXXXXXXXXXXX..',
          '...XXXX..XXXX...',
          '...XXXXXXXXXX...',
          '....XX.XX.XX....',
          '....XX.XX.XX....',
          '................',
          '................',
          '................',
          '................'
        ];
        for (var y = 0; y < SIZE; y++) {
          for (var x = 0; x < SIZE; x++) {
            grid[y * SIZE + x] = art[y][x] === 'X' ? '#0a0a0a' : '#ffffff';
          }
        }
        SoundFX.pop();
        drawGrid();

      mount.querySelector('#pxPresetCheck').addEventListener('click', function () {

            grid[y * SIZE + x] = ((x + y) % 2 === 0) ? '#0a0a0a' : '#ffffff';
          }
        }
        SoundFX.pop();
        drawGrid();
      });

      mount.querySelector('#pxClear').addEventListener('click', function () {
        grid = new Array(SIZE * SIZE).fill('#ffffff');
        SoundFX.click();
        drawGrid();
      });

      mount.querySelector('#pxDownload').addEventListener('click', function () {
        var out = document.createElement('canvas');
        out.width = 512; out.height = 512;
        var octx = out.getContext('2d');

        for (var y = 0; y < SIZE; y++) {
          for (var x = 0; x < SIZE; x++) {

    /* 9. AMBIENT SOUNDBOARD MIXER */
    GAME_BUILDERS.mixer = function (mount) {
      var CHANNELS = [
        { id: 'rain', name: 'Rain', kind: 'rain', desc: 'Filtered pink-noise rainfall', level: 45 },
        { id: 'thunder', name: 'Thunder', kind: 'bolt', desc: 'Deep sub-bass storm rumble', level: 0 },
        { id: 'lofi', name: 'Lo-Fi Vinyl Crackle', kind: 'note', desc: 'Warm chord hum + vinyl dust pops', level: 35 },
        { id: 'fire', name: 'Campfire', kind: 'flame', desc: 'Crackling wood embers', level: 0 },
        { id: 'wind', name: 'Wind', kind: 'wind', desc: 'Sweeping canyon breeze', level: 20 },
        { id: 'synth', name: 'Deep Synth', kind: 'spiral', desc: 'Atmospheric harmonic drone', level: 0 }
      ];

      var running = false;
      var activeNodes = [];
      var gains = {};

      mount.innerHTML =
        '<div class="space-between">' +
          '<div class="row-wrap">' +
            '<button type="button" class="btn btn-primary" id="mixPowerBtn">▶ Start Soundboard</button>' +
            '<button type="button" class="btn btn-ghost" data-mix-preset="rainy">Rainy Night</button>' +
            '<button type="button" class="btn btn-ghost" data-mix-preset="vinyl">Lo-Fi Study</button>' +
            '<button type="button" class="btn btn-ghost" data-mix-preset="orbit">Deep Synth</button>' +
          '</div>' +
          '<div class="muted-text" id="mixStatus">Audio paused</div>' +
        '</div>' +
        '<div class="mixer-grid" id="mixGrid"></div>';

      var powerBtn = mount.querySelector('#mixPowerBtn');
      var statusEl = mount.querySelector('#mixStatus');
      var gridEl = mount.querySelector('#mixGrid');

      function stopAudio() {
        running = false;
        activeNodes.forEach(function (n) {
          try { if (n.stop) n.stop(); } catch (e) {}
          try { n.disconnect(); } catch (e) {}
        });
        activeNodes = [];
        gains = {};
        powerBtn.textContent = '▶ Start Soundboard';
        statusEl.textContent = 'Audio paused';
      }

      function makeNoiseBuffer(ac, seconds, mode) {
        var len = ac.sampleRate * seconds;
        var buf = ac.createBuffer(1, len, ac.sampleRate);
        var data = buf.getChannelData(0);
        var b0 = 0, b1 = 0, b2 = 0;
        for (var i = 0; i < len; i++) {
          var white = Math.random() * 2 - 1;
          if (mode === 'pink') {
            b0 = 0.997 * b0 + white * 0.029;
            b1 = 0.985 * b1 + white * 0.032;
            b2 = 0.950 * b2 + white * 0.048;
            data[i] = (b0 + b1 + b2 + white * 0.12) * 0.45;
          } else if (mode === 'crackle') {
            data[i] = Math.random() < 0.0025 ? (Math.random() * 1.4 - 0.7) : (white * 0.015);
          } else {
            data[i] = white;
          }
        }
        return buf;
      }

      function startAudio() {
        var ac = SoundFX.getContext();
        if (!ac) return;
        stopAudio();
        running = true;
        powerBtn.textContent = '⏹ Stop Soundboard';
        statusEl.textContent = 'Synthesizing live Web Audio';

        var pinkBuf = makeNoiseBuffer(ac, 3, 'pink');
        var whiteBuf = makeNoiseBuffer(ac, 2, 'white');
        var crackleBuf = makeNoiseBuffer(ac, 3, 'crackle');

        // Rain
        var rainSrc = ac.createBufferSource(); rainSrc.buffer = pinkBuf; rainSrc.loop = true;
        var rainFilter = ac.createBiquadFilter(); rainFilter.type = 'bandpass'; rainFilter.frequency.value = 1150; rainFilter.Q.value = 0.6;
        var rainGain = ac.createGain();
        rainSrc.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(ac.destination);
        rainSrc.start(); activeNodes.push(rainSrc, rainFilter, rainGain); gains.rain = rainGain;

        // Thunder
        var thSrc = ac.createBufferSource(); thSrc.buffer = pinkBuf; thSrc.loop = true;
        var thFilter = ac.createBiquadFilter(); thFilter.type = 'lowpass'; thFilter.frequency.value = 115;
        var thGain = ac.createGain();
        thSrc.connect(thFilter); thFilter.connect(thGain); thGain.connect(ac.destination);
        thSrc.start(); activeNodes.push(thSrc, thFilter, thGain); gains.thunder = thGain;

        // Lo-Fi Vinyl Crackle + Warm Chord
        var lofiGain = ac.createGain(); lofiGain.connect(ac.destination);
        var crkSrc = ac.createBufferSource(); crkSrc.buffer = crackleBuf; crkSrc.loop = true;
        var crkFilter = ac.createBiquadFilter(); crkFilter.type = 'highpass'; crkFilter.frequency.value = 1800;
        crkSrc.connect(crkFilter); crkFilter.connect(lofiGain); crkSrc.start();
        activeNodes.push(crkSrc, crkFilter, lofiGain);
        [130.81, 164.81, 196.0].forEach(function (freq) {
          var osc = ac.createOscillator(); var g = ac.createGain();
          osc.type = 'triangle'; osc.frequency.value = freq; g.gain.value = 0.04;
          osc.connect(g); g.connect(lofiGain); osc.start(); activeNodes.push(osc, g);
        });
        gains.lofi = lofiGain;

        // Campfire
        var fireSrc = ac.createBufferSource(); fireSrc.buffer = whiteBuf; fireSrc.loop = true;
        var fireFilter = ac.createBiquadFilter(); fireFilter.type = 'bandpass'; fireFilter.frequency.value = 600; fireFilter.Q.value = 1.9;
        var fireGain = ac.createGain();
        fireSrc.connect(fireFilter); fireFilter.connect(fireGain); fireGain.connect(ac.destination);
        fireSrc.start(); activeNodes.push(fireSrc, fireFilter, fireGain); gains.fire = fireGain;

        // Wind
        var windSrc = ac.createBufferSource(); windSrc.buffer = pinkBuf; windSrc.loop = true;
        var windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 420; windFilter.Q.value = 2.4;
        var windLfo = ac.createOscillator(); var windLfoG = ac.createGain();

        windLfo.connect(windLfoG); windLfoG.connect(windFilter.frequency);
        var windGain = ac.createGain();
        windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(ac.destination);
        windSrc.start(); windLfo.start();
        activeNodes.push(windSrc, windFilter, windLfo, windLfoG, windGain); gains.wind = windGain;

        // Deep Synth
        var synthGain = ac.createGain();
        var synthFilter = ac.createBiquadFilter(); synthFilter.type = 'lowpass'; synthFilter.frequency.value = 480;
        synthFilter.connect(synthGain); synthGain.connect(ac.destination);

            : (p === 'vinyl'

              : { rain: 0, thunder: 15, lofi: 20, fire: 0, wind: 35, synth: 70 });
